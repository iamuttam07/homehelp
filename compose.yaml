# Local development infrastructure for HomeHelp.
# Run from the repo root:  docker compose up -d
name: homehelp

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: homehelp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homehelp}
      POSTGRES_USER: ${POSTGRES_USER:-homehelp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homehelp_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homehelp} -d ${POSTGRES_DB:-homehelp}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: homehelp-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: homehelp-mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

volumes:
  postgres_data:
  redis_data:
