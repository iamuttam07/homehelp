spring.application.name=homehelp

server.port=${SERVER_PORT:8080}

# Actuator: expose health and info over HTTP
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true

info.app.name=HomeHelp
info.app.version=@project.version@

# Database (defaults match .env.example / compose.yaml)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:homehelp}
spring.datasource.username=${POSTGRES_USER:homehelp}
spring.datasource.password=${POSTGRES_PASSWORD:homehelp_dev_password}

# Flyway owns the schema; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Errors are returned as RFC 9457 problem details (application/problem+json)
spring.mvc.problemdetails.enabled=true

# JWT. The default secret is for local development only: set JWT_SECRET
# (at least 32 bytes, e.g. `openssl rand -base64 48`) anywhere else.
homehelp.security.jwt.secret=${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789}
homehelp.security.jwt.issuer=homehelp
homehelp.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
homehelp.security.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:14d}
